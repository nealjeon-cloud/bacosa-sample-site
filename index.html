<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바코사 예제 사이트</title>
<style>
  :root { --blue:#8FA8FF; --deep:#2F45B5; --soft:#EEF2FF; --ink:#1A1A1A; --bg:#FCFBF8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:640px; margin:0 auto; padding:56px 24px; }
  .chip { display:inline-block; background:var(--blue); padding:6px 14px; border-radius:999px; font-weight:700; font-size:14px; }
  h1 { font-size:40px; line-height:1.25; margin:24px 0 16px; }
  h1 mark { background:linear-gradient(transparent 58%, #FFE14D 58%); color:inherit; }
  p { font-size:17px; line-height:1.7; }
  .card { background:var(--soft); border-radius:12px; padding:20px 22px; margin:28px 0; }
  .card b { color:var(--deep); }
  a.btn { display:inline-block; background:var(--deep); color:#fff; text-decoration:none; padding:12px 20px; border-radius:10px; font-weight:700; }
  footer { color:#6F6F6A; font-size:13px; margin-top:48px; }
</style>
</head>
<body>
<main>
  <span class="chip">바코사 예제 사이트</span>
  <h1>코딩 몰라도<br><mark>AI한테 시켜서</mark> 올린 사이트</h1>
  <p>이 페이지는 바코사 무료 자료실 전자책을 따라 하면 나오는 예제입니다. 파일 하나(index.html)를 올렸을 뿐인데 인터넷 주소가 생겼습니다.</p>
  <div class="card">
    <p><b>바코사</b>는 바이브코딩을 하는 사람들이 모인 네이버카페입니다. 코딩을 몰라도 AI에게 말로 시켜 만드는 방법을 서로 묻고 나눕니다.</p>
  </div>
  <a class="btn" href="https://cafe.naver.com/bacosa">바코사 카페 가기</a>
  <footer>바코사 무료 자료실 예제 · 2026-10-18</footer>
</main>
</body>
</html>
